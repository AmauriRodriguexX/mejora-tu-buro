# Legacy GitHub Pages workflow, disabled in favor of deploy-pages.yml
name: Legacy Pages deployment (disabled)

on:
  push:
    branches: ["__legacy_pages_disabled__"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Retained only for history; this workflow must not deploy GitHub Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disabled. deploy-pages.yml is the sole Pages deploy workflow."
